<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Préstamo de equipo</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="app-container">
    <div class="app-state">
      <h2>Bienvenido</h2>
      <p>Elige una sección para empezar.</p>
    </div>

    <ion-list class="app-list">
      @for (seccion of secciones; track seccion.url) {
        <ion-item class="app-card" [routerLink]="seccion.url" detail="true">
          <ion-icon slot="start" [name]="seccion.icono" aria-hidden="true"></ion-icon>
          <ion-label>
            <h2>{{ seccion.titulo }}</h2>
            <p>{{ seccion.descripcion }}</p>
          </ion-label>
        </ion-item>
      }
    </ion-list>
  </div>
</ion-content>
